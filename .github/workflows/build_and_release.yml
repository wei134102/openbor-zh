name: Build OpenBOR

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        default: all
        type: choice
        options:
          - all
          - wii
          - linux-amd64

jobs:
  build-docker:
    name: Docker build (${{ inputs.target }})
    if: inputs.target == 'all' || inputs.target == 'wii'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build devcontainer image
        run: |
          if [ "${{ inputs.target }}" = "wii" ]; then
            docker build -t openbor-build -f .devcontainer/Dockerfile.wii .devcontainer
          else
            docker build -t openbor-build -f .devcontainer/Dockerfile .devcontainer
          fi

      - name: Build OpenBOR (all targets)
        if: inputs.target == 'all'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            openbor-build \
            ./build-all.sh

      - name: Build OpenBOR (Wii only)
        if: inputs.target == 'wii'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            openbor-build \
            bash -lc 'rm -rf build.wii && mkdir build.wii && cd build.wii && \
              $DEVKITPRO/portlibs/wii/bin/powerpc-eabi-cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_WII=ON .. && \
              make -j $(nproc)'

      - name: Verify build outputs
        run: |
          test -f engine/releases/WII/boot.dol
          echo "WII boot.dol: OK ($(wc -c < engine/releases/WII/boot.dol) bytes)"
          if [ "${{ inputs.target }}" = "all" ]; then
            test -d engine/releases/LINUX
            test -d engine/releases/WINDOWS
            test -d engine/releases/DARWIN
            echo "LINUX / WINDOWS / DARWIN: OK"
          fi

      - name: Read version
        id: version
        run: echo "version_name=$(cat engine/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openbor_${{ steps.version.outputs.version_name }}_${{ inputs.target }}
          path: engine/releases/
          if-no-files-found: error

  build-linux-amd64:
    name: Linux AMD64 (native)
    if: inputs.target == 'all' || inputs.target == 'linux-amd64'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake zstd \
            libsdl2-dev libvorbis-dev libpng-dev libvpx-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_LINUX=ON -DTARGET_ARCH=AMD64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Verify build output
        run: |
          test -f engine/releases/LINUX/AMD64/OpenBOR
          echo "LINUX AMD64 OpenBOR: OK"

      - name: Read version
        id: version
        run: echo "version_name=$(cat engine/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openbor_${{ steps.version.outputs.version_name }}_linux-amd64
          path: engine/releases/LINUX/AMD64/
          if-no-files-found: error
